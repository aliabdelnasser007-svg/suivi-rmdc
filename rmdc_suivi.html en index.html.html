<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>RMDC – Suivi de révision</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fa;--card:#fff;--tx:#17222f;--mu:#667487;--bd:#dde3ec;--ok:#2e9e5b;--ac:#12355b;--wa:#e65100}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1520;--card:#18212f;--tx:#e8edf5;--mu:#97a4b8;--bd:#2a3649;--ok:#46c07a;--ac:#7fb2ee;--wa:#ffa04d}}
:root[data-theme="dark"]{--bg:#0f1520;--card:#18212f;--tx:#e8edf5;--mu:#97a4b8;--bd:#2a3649;--ok:#46c07a;--ac:#7fb2ee;--wa:#ffa04d}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:14px}h1{font-size:20px;margin:6px 0}h2{font-size:16px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.bar{height:12px;background:var(--bd);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);transition:width .25s}
.big{font-size:34px;font-weight:700;color:var(--ok)}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sp{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.dept{cursor:pointer;border-left:6px solid var(--c);padding:12px}.dept:active{transform:scale(.98)}.dept b{display:block;margin-bottom:4px}.mu{color:var(--mu);font-size:13px}
.msg{background:rgba(230,81,0,.12);border-radius:10px;padding:10px;font-weight:600;color:var(--wa)}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
.btn.p{background:var(--ac);color:var(--bg);border:0}
.t{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--bd)}.t:last-child{border:0}
.t .nm{flex:1 1 220px;font-weight:600}.tag{font-size:11px;padding:2px 7px;border-radius:9px;background:var(--bd);color:var(--mu);margin-left:6px}.tag.r{background:#fde4e4;color:#b71c1c}
label.ck{display:flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;font-size:13px;cursor:pointer;user-select:none}
label.ck input{width:20px;height:20px;accent-color:var(--ok)}label.ck.on{background:rgba(46,158,91,.15);border-color:var(--ok)}
.st{min-width:64px;text-align:right;font-weight:700}
.bd{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}.bd.lock{opacity:.5}.bd:last-child{border:0}
.hd{border-radius:14px;padding:14px;color:#fff;margin-bottom:12px}.hd .bar{background:rgba(255,255,255,.3)}.hd .bar i{background:#fff}
a.back{color:#fff;font-weight:700;cursor:pointer;text-decoration:underline}
</style></head><body><main id="app"></main>
<script>
const DATA={"d":[{"n":"Obstétrique","c":"#1F6F8B","t":[["Soins prénataux – dépistage et prévention",""],["Soins prénataux – grossesse",""],["Travail (labor)",""],["Saignement du 1er trimestre",""],["Saignement des 2e et 3e trimestres",""],["Hémorragie du post-partum",""],["Troubles hypertensifs de la grossesse",""],["Hyperglycémie (grossesse)",""],["Fièvre (grossesse)",""],["Pâleur (grossesse)","E"],["Ictère (grossesse)","E"],["Palpitations (grossesse)",""],["Douleur thoracique et dyspnée (grossesse)",""],["Membre gonflé (grossesse)",""],["Dysurie (grossesse)",""],["Infections puerpérales – fièvre",""],["Infections puerpérales – douleur abdominale",""],["Menace d'accouchement prématuré / RPM – perte de liquide",""],["Sujets spéciaux en grossesse","PD"]]},{"n":"Gynécologie","c":"#8E4585","t":[["Pertes vaginales",""],["Prurit vulvo-vaginal",""],["Douleur pelvienne",""],["Fièvre (infection pelvienne)",""],["Saignement vaginal (SUA – PALM-COEIN)",""],["Saignements (SUA)",""],["Perte de poids (tumeurs gynécologiques)",""],["Ulcérations génitales",""],["Gonflement et douleur abdominale",""],["Dysfonction digestive (tumeurs)",""],["Anatomie / physiologie / santé reproductive féminine","PD"],["Infertilité – échec de conception",""],["Planification familiale",""],["Troubles menstruels",""],["Avortements (médical, à risque, interruption)",""]]},{"n":"Soins critiques et périopératoire","c":"#B5472B","t":[["Coma",""],["Convulsions",""],["Fluides et prise en charge de la douleur",""]]},{"n":"Maladies infectieuses","c":"#2E7D32","t":[["Pneumonie (adulte)","PD"],["VIH",""],["Tuberculose",""],["Sepsis","E"],["Paludisme",""]]},{"n":"Cardiovasculaire","c":"#C62828","t":[["Hypertension","E"],["Cardiopathie ischémique",""],["Insuffisance cardiaque",""],["Infarctus du myocarde",""]]},{"n":"Gastro-entérologie (médecine)","c":"#6D4C41","t":[["Hémorragie digestive","E"],["Cirrhose",""],["Cancer digestif",""],["Dyspepsie","E"],["Ictère",""]]},{"n":"Respiratoire","c":"#0277BD","t":[["Asthme" nsuffisance rénale aiguë (chirurgie)",""],["Rétention aiguë d'urine",""],["Troubles urinaires du bas appareil (LUTS)",""]]},{"n":"Appareil musculo-squelettique","c":"#795548","t":[["Fractures",""],["Luxations",""]]},{"n":"Chirurgie endocrine / sein / pancréas","c":"#F9A825","t":[["Masses mammaires",""],["Tumeurs pancréatiques",""],["Pancréatite",""],["Masses cervicales",""]]},{"n":"Traumatologie aiguë","c":"#D84315","t":[["Brûlures",""],["Prise en charge du traumatisé (ABCDE)",""]]},{"n":"Oncologie chirurgicale","c":"#424242","t":[["Masses abdominales",""],["Cancer colorectal",""],["Cancer de la prostate",""],["Cancer du pénis",""],["Cancer de la vessie",""],["Tumeurs musculo-squelettiques",""]]},{"n":"ORL","c":"#0097A7","t":[["Otalgie",""],["Otorrhée",""],["Hypoacousie",""],["Épistaxis",""],["Obstruction des voies aériennes supérieures",""]]},{"n":"Ophtalmologie","c":"#1565C0","t":[["Œil rouge",""],["Gonflement orbitaire",""],["Perte de vision",""],["Œil et maladies systémiques",""]]},{"n":"Chirurgie – périopératoire et divers","c":"#455A64","t":[["Traumatisme (général)",""],["Soins palliatifs",""],["Lombalgie / gestion de la douleur",""],["Maltraitance infantile",""],["Violence conjugale",""],["Sepsis (chirurgie)",""],["Infections chirurgicales",""],["Infections du site opératoire",""],["Considérations préopératoires",""],["Considérations peropératoires",""],["Considérations postopératoires",""],["Nutrition du patient chirurgical",""]]},{"n":"Malformations congénitales","c":"#6A1B9A","t":[["Défauts de la paroi abdominale (omphalocèle / laparoschisis)",""],["Pied bot",""],["Atrésies digestives",""],["Fistule trachéo-œsophagienne",""],["Fente labio-palatine",""],["Spina bifida",""]]},{"n":"Imagerie chirurgicale","c":"#37474F","t":[["Radiographie des os longs",""],["ASP (abdomen sans préparation)",""],["Radiographie du thorax",""]]},{"n":"Santé publique, éthique et système de santé","c":"#2E7D32","t":[["Investigation d'épidémie – maladies aéroportées","PD"],["One Health – zoonoses, morsures, bilharziose",""],["Système de santé – piliers, sécurité du patient, documents médicaux",""],["Santé au travail (accidents de la route, risques professionnels)","PD"],["Services communautaires – soins à domicile, violences sexuelles",""],["Éthique – faute professionnelle, avortement, médico-légal",""],["Collaboration interprofessionnelle – travail d'équipe",""],["Soins palliatifs – annonce de mauvaises nouvelles / cancer",""],["Éducation sanitaire et médecine traditionnelle",""],["Médecine fondée sur les preuves (EBM)",""]]},{"n":"Pédiatrie","c":"#F57F17","t":[["Pneumonie (enfant)",""],["Bronchiolite aiguë",""],["Asthme (enfant)",""],["Corps étranger des voies aériennes",""],["Gastro-entérite aiguë",""],["Constipation",""],["Arythmies cardiaques",""],["Insuffisance cardiaque congestive",""],["Rhumatisme articulaire aigu",""],["Endocardite infectieuse",""],["Anémie (enfant)",""],["Acidocétose diabétique (enfant)",""],["Arthrite septique",""],["État de mal épileptique convulsif",""],["Paludisme (enfant)",""],["Méningite",""],["Tuberculose (enfant)",""],["Infections urinaires",""],["VIH (enfant)",""],["Vaccination",""],["Otite moyenne aiguë / externe",""],["Réanimation néonatale",""],["Sepsis néonatal",""],["Sortie et suivi du nouveau-né",""],["Infections acquises (néonatal)",""],["Hypoglycémie néonatale",""],["Ictère néonatal",""],["Hypothermie néonatale",""],["Détresse respiratoire (SDR)",""],["Entérocolite ulcéro-nécrosante",""],["Pneumothorax (néonatal)",""],["Persistance du canal artériel (PCA)",""],["Eczéma",""],["Troubles nutritionnels (enfant)",""]]}],"p":[["Pratique seule","Appareil musculo-squelettique","Infections ostéo-articulaires",0,5],["Pratique dominante","Obstétrique","Sujets spéciaux en grossesse",2,6],["Pratique dominante","Gynécologie","Anatomie / physiologie / santé reproductive féminine",1,2],["Pratique dominante","Dermatologie et IST","Écoulements et lésions génitales",1,5],["Pratique dominante","Maladies infectieuses","Pneumonie (adulte)",2,3],["Pratique dominante","Neurologie","AVC (médecine)",2,5],["Pratique dominante","Santé publique, éthique et système de santé","Investigation d'épidémie – maladies aéroportées",1,3],["Pratique dominante","Santé publique, éthique et système de santé","Santé au travail (accidents de la route, risques professionnels)",1,3]]};
const K="rmdc_suivi_v2";let st={},ts=0,ref=null,tm=null,sync="⏳ Connexion à la sauvegarde…";
try{const o=JSON.parse(localStorage.getItem(K)||localStorage.getItem("rmdc_suivi_v1")||"{}");if(o.s){st=o.s;ts=o.t||0}else st=o}catch(e){}
const loc=()=>{try{localStorage.setItem(K,JSON.stringify({s:st,t:ts}))}catch(e){}};
function push(){if(!ref)return;clearTimeout(tm);tm=setTimeout(()=>{ref.set({s:JSON.stringify(st),t:ts}).then(()=>{sync="☁️ Sauvegardé dans ton compte (synchronisé entre appareils)";mark()}).catch(()=>{sync="⚠️ Sauvegarde cloud impossible — enregistré sur cet appareil";mark()})},500)}
const mark=()=>{const e=document.getElementById("sy");if(e)e.textContent=sync};
const save=()=>{ts=Date.now();loc();push()};
(async()=>{try{if(typeof claude==="undefined")throw 0;const u=await claude.use("user"),db=await claude.use("db");if(!u||!db)throw 0;const id=await u.id();if(!id)throw 0;
 ref=db.doc("data/users/"+id+"/progress");const sn=await ref.get();
 if(sn.exists){const d=sn.data();if((d.t||0)>ts){st=JSON.parse(d.s);ts=d.t;loc()}else if(ts>(d.t||0))push()}else if(ts)push();
 sync="☁️ Sauvegardé dans ton compte (synchronisé entre appareils)"}catch(e){ref=null;sync="💾 Sauvegardé sur cet appareil uniquement (connexion au compte indisponible)"}
 setTimeout(render,0)})();
const g=id=>st[id]||[0,0,0],pc=id=>g(id).reduce((a,b)=>a+b,0)/3;
const P=x=>Math.round(x*100)+"%",app=document.getElementById("app");
const dep=DATA.d.map((d,i)=>({...d,i,t:d.t.map((t,j)=>({n:t[0],f:t[1],id:"d"+i+"t"+j}))}));
const prat=DATA.p.map((p,k)=>({cat:p[0],dp:p[1],n:p[2],w:p[3],p:p[4],id:"p"+k}));
const avg=a=>a.length?a.reduce((s,x)=>s+pc(x.id),0)/a.length:0;
const all=dep.flatMap(d=>d.t);
const badge=p=>p>=1?"💎 Maître":p>=.75?"🥇 Or":p>=.5?"🥈 Argent":p>=.25?"🥉 Bronze":p>0?"🌱 Lancé":"⏳ À démarrer";
function stats(){const N=all.length,m=all.filter(x=>pc(x.id)==1).length,e=all.filter(x=>pc(x.id)>0&&pc(x.id)<1).length;
 const ov=all.reduce((s,x)=>s+pc(x.id),0)/N,pp=avg(prat);
 const cnt=k=>all.filter(x=>g(x.id)[k]).length;
 return{N,m,e,ov,pp,qcm:cnt(1),rev:cnt(2),full:dep.filter(d=>avg(d.t)==1).length}}
function msg(o){return o==0?"Rien de validé pour l'instant. Le premier thème est le plus dur : ouvre un département et attaque-le maintenant.":o<.25?"Démarrage correct, mais ce n'est pas un niveau d'examen. Vise 3 thèmes maîtrisés par jour, QCM inclus.":o<.5?"Tu avances. Attention : lire ne suffit pas, la case QCM révèle tes vraies lacunes.":o<.75?"Plus de la moitié faite. Traque les thèmes « Écrit seul » : ils ne se rattrapent pas en pratique.":o<.95?"Dernière ligne droite : révision finale sur tous les thèmes, sans exception.":"Niveau jury atteint. Garde le rythme et consolide."}
let ask=false,only=false;
function home(){const s=stats();
 const B=[["🌱 Premier pas — 1 thème maîtrisé",s.m,1],["📚 Lecteur assidu — 10 thèmes maîtrisés",s.m,10],["🏅 Cinquantaine — 50 thèmes maîtrisés",s.m,50],["🥉 Bronze — 25 % global",s.ov,.25],["🥈 Argent — 50 % global",s.ov,.5],["🥇 Or — 75 % global",s.ov,.75],["💎 Prêt pour le jury — 95 % global",s.ov,.95],["🎯 Tireur d'élite QCM — 50 QCM faits",s.qcm,50],["🔁 Réviseur — 30 révisions finales",s.rev,30],["🏆 Département complet — 1 à 100 %",s.full,1],["🩺 Sniper pratique — 100 % pratique",s.pp,1]];
 app.innerHTML=`<h1>🩺 RMDC — Licence Médecine Générale</h1><div class="mu">Priorité : l'examen écrit. Touche un département pour ouvrir ses thèmes.</div><div class="mu" id="sy">${sync}</div>
 <div class="card" style="margin-top:10px"><div class="row"><div class="big">${P(s.ov)}</div><div class="sp"><div class="bar"><i style="width:${s.ov*100}%"></i></div><div class="mu" style="margin-top:6px">${s.N} thèmes · ${s.m} maîtrisés · ${s.e} en cours · ${s.N-s.m-s.e} à commencer</div></div></div><div class="msg" style="margin-top:10px">${msg(s.ov)}</div></div>
 <div class="card dept" style="--c:#c62828" data-go="prat"><b>🩺 Pratique seule / dominante</b><div class="bar"><i style="width:${s.pp*100}%"></i></div><div class="mu">${P(s.pp)} · ${prat.length} thèmes</div></div>
 <h2>Départements (écrit)</h2><div class="grid">${dep.map(d=>{const a=avg(d.t),m=d.t.filter(x=>pc(x.id)==1).length;return`<div class="card dept" style="--c:${d.c}" data-go="d${d.i}"><b>${d.n}</b><div class="bar"><i style="width:${a*100}%"></i></div><div class="mu">${P(a)} · ${m}/${d.t.length} maîtrisés · ${badge(a)}</div></div>`}).join("")}</div>
 <h2>🏅 Badges</h2><div class="card">${B.map(b=>{const ok=b[1]>=b[2];return`<div class="bd ${ok?"":"lock"}"><span>${ok?"🔓":"🔒"}</span><span class="sp">${b[0]}</span><span class="mu">${b[2]<=1&&b[2]%1?P(b[1])+" / "+P(b[2]):b[2]==1&&b[1]<=1&&b[1]%1?P(b[1]):Math.min(b[1],b[2])+" / "+b[2]}</span></div>`}).join("")}</div>
 <div class="row"><span class="sp"></span><button class="btn" data-act="reset">${ask?"Confirmer : tout effacer ?":"Réinitialiser"}</button></div>`}
function ck(id,k,l,v){return`<label class="ck ${v?"on":""}"><input type="checkbox" data-id="${id}" data-k="${k}" ${v?"checked":""}>${l}</label>`}
function row(x,tags,labels){const v=g(x.id),p=pc(x.id);return`<div class="t"><div class="nm">${x.n}${tags}</div>${labels.map((l,k)=>ck(x.id,k,l,v[k])).join("")}<div class="st" style="color:${p==1?"var(--ok)":"var(--mu)"}">${P(p)}</div></div>`}
function dview(d){const a=avg(d.t),L=["Cours lu","QCM","Révision"];
 const list=d.t.filter(x=>!only||x.f=="E");
 app.innerHTML=`<div class="hd" style="background:${d.c}"><a class="back" data-go="">← Tableau de bord</a><h1>${d.n}</h1><div class="row"><b style="font-size:26px">${P(a)}</b><div class="sp"><div class="bar"><i style="width:${a*100}%"></i></div></div></div><div style="margin-top:6px;font-size:13px">${d.t.filter(x=>pc(x.id)==1).length}/${d.t.length} maîtrisés · ${badge(a)}</div></div>
 <div class="row" style="margin-bottom:8px"><button class="btn ${only?"p":""}" data-act="only">Écrit seul uniquement</button><span class="mu">3 cases cochées = thème maîtrisé</span></div>
 <div class="card">${list.map(x=>row(x,(x.f=="E"?'<span class="tag r">Écrit seul</span>':"")+(x.f=="PD"?'<span class="tag">★ pratique dominante</span>':""),L)).join("")||"<div class='mu'>Aucun thème.</div>"}</div>`}
function pview(){const a=avg(prat),L=["Examen clinique / gestes","Cas OSCE","Checklist"];
 app.innerHTML=`<div class="hd" style="background:#c62828"><a class="back" data-go="">← Tableau de bord</a><h1>🩺 Pratique seule & dominante</h1><div class="row"><b style="font-size:26px">${P(a)}</b><div class="sp"><div class="bar"><i style="width:${a*100}%"></i></div></div></div></div>
 <div class="mu" style="margin-bottom:8px">Pratique seule = aucune case écrite dans le blueprint (un seul thème). Pratique dominante = critère à moi : ≤ 2 domaines à l'écrit, davantage en pratique.</div>
 <div class="card">${prat.map(x=>row(x,`<span class="tag ${x.cat=="Pratique seule"?"r":""}">${x.cat}</span><div class="mu">${x.dp}</div>`,L)).join("")}</div>`}
function render(){const h=location.hash.slice(1),y=scrollY;
 if(h=="prat")pview();else if(/^d\d+$/.test(h)&&dep[+h.slice(1)])dview(dep[+h.slice(1)]);else home();scrollTo(0,y)}
app.addEventListener("click",e=>{const t=e.target.closest("[data-go]");if(t){location.hash=t.dataset.go;scrollTo(0,0);return}
 const a=e.target.closest("[data-act]");if(!a)return;
 if(a.dataset.act=="only"){only=!only;render()}
 if(a.dataset.act=="reset"){if(ask){st={};save();ask=false}else ask=true;render()}});
app.addEventListener("change",e=>{const i=e.target;if(!i.dataset.id)return;const v=g(i.dataset.id).slice();v[+i.dataset.k]=i.checked?1:0;st[i.dataset.id]=v;save();render()});
addEventListener("hashchange",render);render();
</script></body></html>
